# Supabase Auth configuration, kept in the repository rather than only in the
# dashboard.
#
# Why this file exists at all: `emailRedirectTo` on `signInWithOtp` is not a
# free text field. Supabase compares it against the project's redirect
# allowlist, and when it does not match it silently substitutes `site_url`
# instead of returning an error. The failure mode is therefore not a broken
# call, it is a magic link that arrives in a real person's inbox and lands them
# somewhere that cannot complete a session. A sibling project lost time to
# exactly that, so the allowlist is declared here where a reviewer can see it,
# and pushed with `npm run supabase:auth-config`.
#
# Every entry below is a URL the app actually asks for. Adding one here is the
# only thing that makes the matching `emailRedirectTo` work.
[auth]
enabled = true
site_url = "https://jobinno.app"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://jobinno.app/auth/callback",
  # JOB-023. `www.jobinno.app` is a second live hostname for the same Vercel
  # deployment, not a typo: it is a CNAME to Vercel and answers `/login` with a
  # 200. People arrive on it, so the magic link has to be allowed to land on it.
  "https://www.jobinno.app/auth/callback",
]

# Everything from here down restates what the project already has set. It is
# spelled out rather than left off because `config push` sends the whole auth
# block, filling anything absent with the CLI's own defaults: leaving a key out
# does not mean "leave it alone", it means "reset it". The first run of this
# file, before these lines were added, was about to turn TOTP enrollment off and
# shorten the email one time code from eight digits to six purely by omission.
#
# So when a reviewer reads a value here that nobody asked for, that is why. Keep
# it matching the project unless a ticket is deliberately changing it.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Signing up is how a user gets here in the first place, and there are no
# passwords anywhere in Jobinno, so the only credential is the emailed link.
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# ── Who actually sends the email (JOB-024) ──────────────────────────────────
# There is no `[auth.email.smtp]` section below, and that means this project is
# on Supabase's own built in mailer. That mailer is a development convenience,
# not a sending service. Measured against this project's live auth logs on 21
# August it allowed exactly two messages an hour and refused everything after
# that with "email rate limit exceeded":
#
#   03:40:34  mail.send        delivered
#   03:43:32  mail.send        delivered
#   03:43:42  POST /otp  429   email rate limit exceeded
#   03:44:05  POST /otp  429   email rate limit exceeded
#   03:44:14  POST /otp  429   email rate limit exceeded
#   03:44:36  POST /otp  429   email rate limit exceeded
#
# Two accounts an hour, across everybody, is the whole signup capacity of the
# product while this stays as it is. Three real people were turned away in the
# 64 seconds above.
#
# Fixing it needs custom SMTP, and custom SMTP needs a verified sending domain,
# which needs DNS records only the domain owner can add. So the fix is not in
# this file yet and this comment is here instead of a half configured section
# that would look like one.
#
# ── Read this before adding the section ─────────────────────────────────────
# `config push` sends the whole auth block and fills anything absent with the
# CLI's own defaults, which is the warning at the top of this file. SMTP is
# covered by that warning. So if custom SMTP is turned on in the dashboard and
# this file is left as it is, the next `npm run supabase:auth-config` is liable
# to switch it back off, and the symptom would be signups quietly failing again
# with nobody having touched email.
#
# Whoever enables SMTP therefore has to do both halves, in this order:
#
#  1. Configure it, either in the dashboard under Authentication then SMTP, or
#     with the Management API. Supabase applies its own limit of 30 messages an
#     hour to newly configured SMTP; raise it under Authentication, Rate Limits,
#     or the second hour of real traffic looks exactly like tonight.
#  2. Uncomment the section below, set the password variable in the environment
#     the command runs in, and push. For Resend the values are `smtp.resend.com`
#     on port 587, username `resend`, and the API key as the password.
#
# The password stays out of this file. `auth.email.smtp.pass` is one of the keys
# the CLI resolves from the environment, so the repository carries the shape and
# never the secret.
#
# [auth.email.smtp]
# host = "smtp.resend.com"
# port = 587
# user = "resend"
# pass = "env(SUPABASE_AUTH_SMTP_PASS)"
# admin_email = "noreply@jobinno.app"
# sender_name = "Jobinno"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
