name: CI

# `v1` (JOB-032 era) is a second long-lived integration branch alongside
# `main` while the live site is gated behind a waitlist — every pre-launch
# fix lands there first, tested via Vercel preview, before eventually
# merging back into `main`. Without `v1` in these branch lists this workflow
# silently never runs on any PR targeting it: not caught for several PRs
# (JOB-024, JOB-027 through JOB-030) before this was noticed. Drop `v1` here
# once it has merged back into `main` and the branch is retired.
on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jobinno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A GitHub runner gives Node a 2GB heap by default, and type checking this
      # project needs more than that: `googleapis`, which the Gmail modules pull
      # in, ships enormous type definitions and costs about 1.8GB on its own.
      # The runner has 16GB, so this is headroom rather than a real ceiling.
      NODE_OPTIONS: --max-old-space-size=6144

      # Throwaway service container, not a real database. Nothing destructive
      # should run against a real DATABASE_URL without an explicit opt in gate.
      DATABASE_URL: postgres://test:test@localhost:5432/jobinno_test

      # That gate. The suites in `tests/unit` that create and delete rows check
      # this as well as the host, because a `localhost` host is also what a port
      # forward to production looks like — see `tests/live-db-gate.ts`. Set here
      # and nowhere else: a developer's laptop has to export it per run, which is
      # the point of it.
      ALLOW_LIVE_DB_TESTS: "1"

      # Supabase Auth, not NextAuth. These are placeholders so that the build
      # and the type check have something structurally valid to read; CI never
      # talks to a real Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

      # Anything genuinely secret comes from repository secrets. An unset secret
      # resolves to an empty string, which every module is expected to handle by
      # failing closed rather than by guessing.
      STAGEHAND_LLM_API_KEY: ${{ secrets.STAGEHAND_LLM_API_KEY }}
      RESUME_LLM_API_KEY: ${{ secrets.RESUME_LLM_API_KEY }}
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
      INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
      STRIPE_SECRET_KEY: test_sk
      STRIPE_WEBHOOK_SECRET: whsec_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build to generate types
        run: npm run build

      - name: Prepare the test database
        # A bare Postgres image has no `auth.users`, no `auth.uid()` and none of
        # Supabase's roles, all of which the schema's foreign keys and RLS
        # policies need before they will apply. See the file's own header.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci-test-db-bootstrap.sql

      - name: Push database schema
        run: npx drizzle-kit push

      - name: Apply the hand written privilege migration
        # `drizzle-kit push` diffs `lib/db/schema.ts`, and the Drizzle schema DSL
        # has no way to say GRANT or REVOKE, so the one hand written migration in
        # `drizzle/` is invisible to it. Applied here by name, after the push that
        # creates the table it grants on. A later privilege migration needs its
        # own line here; there is deliberately no glob, because silently applying
        # whatever happens to be in the directory is how a migration nobody meant
        # to run in CI ends up running in CI.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0003_profiles_column_privileges.sql

      - name: Apply the v1-C notification preference migration
        # v1-C (#143). Grants `notification_preference` on `profiles` to
        # `authenticated` so the person can pick their channel. The column
        # itself is created by drizzle-kit push above; this file only carries
        # the CHECK constraint and the column grant, neither of which the
        # Drizzle schema DSL can express.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0014_profiles_notification_preference.sql

      - name: Apply the profiles.github_url privilege migration
        # JOB-044. Same reasoning as the step above, and the same rule: this one
        # grants `github_url`, which `0010_profiles_github_url.sql`'s ALTER TABLE
        # (picked up by the `drizzle-kit push` step) already added by the time
        # this runs.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0016_profiles_github_url_privileges.sql

      - name: Apply the JOB-101 intake field privilege migration
        # JOB-101. Same reasoning again, and the same rule: this one grants the
        # eight columns `0014_profiles_intake_fields.sql` added, which the
        # `drizzle-kit push` step has already created by the time this runs.
        # There is still deliberately no glob over `drizzle/`; a new privilege
        # migration gets its own line here, on purpose.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0020_profiles_intake_fields_privileges.sql

      - name: Apply the resumes privilege migration
        # JOB-112. Same reasoning again, and its own line rather than a glob for
        # the reason three steps up. This one takes the table wide INSERT and
        # UPDATE grants on `resumes` away from `authenticated` so that `parsed`,
        # which now holds the candidate's employment and education history, has
        # exactly one writer.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0021_resumes_column_privileges.sql

      - name: Apply the JOB-134 answer memory privilege migration
        # JOB-134. Same reasoning again, and its own line rather than a glob for
        # the reason four steps up. This one grants the four intake columns
        # `0017_profiles_answer_memory.sql` added and deliberately leaves
        # `stored_answers` ungranted; see that file for why the fifth column is
        # not on the list.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0023_profiles_answer_memory_privileges.sql

      - name: Apply the JOB-189 Gmail refresh token privilege migration
        # JOB-189. Same reasoning again, and its own line rather than a glob for
        # the reason five steps up. This one grants `gmail_refresh_token`,
        # which `0025_profiles_gmail_refresh_token.sql`'s ALTER TABLE (picked
        # up by the `drizzle-kit push` step) already added by the time this
        # runs, to `service_role` only — deliberately not to `authenticated`;
        # see the migration file for why.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0026_profiles_gmail_refresh_token_privileges.sql

      - name: Apply the JOB-192 profiles SELECT lockdown migration
        # JOB-192. Same reasoning again, and its own line rather than a glob
        # for the reason six steps up. This one revokes the table wide SELECT
        # grant on `profiles` from `authenticated` and `anon` and grants
        # SELECT back on every column except `stripe_customer_id`,
        # `browserbase_context_id` and `gmail_refresh_token`, so the three
        # sensitive columns are readable only by the service role. All 34
        # columns it names have been created either by an earlier migration
        # or by the `drizzle-kit push` step above by the time this runs.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0027_profiles_column_select_lockdown.sql

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: tsx CLI resolution smoke check (JOB-029)
        # Type check, lint and the unit tests above never actually run a
        # `lib/*-cli.ts` entrypoint through `tsx` — that gap is exactly how
        # ERR_PACKAGE_PATH_NOT_EXPORTED (issue #47) went unnoticed in CI. See
        # `scripts/check-tsx-cli-resolution.mjs` for the full explanation.
        run: npm run check:cli-resolution

  e2e:
    runs-on: ubuntu-latest
    needs: test
    # Only worth the minutes when the PR actually touches the UI. Runs when the
    # PR is labeled 'ui', or its title mentions ui, dashboard, or page.
    if: |
      contains(github.event.pull_request.title, 'ui') ||
      contains(github.event.pull_request.title, 'dashboard') ||
      contains(github.event.pull_request.title, 'page') ||
      contains(toJson(github.event.pull_request.labels), 'ui')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jobinno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # See the note on the same variable in the `test` job above.
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: postgres://test:test@localhost:5432/jobinno_test
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      STRIPE_SECRET_KEY: test_sk
      STRIPE_WEBHOOK_SECRET: whsec_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare the test database
        # A bare Postgres image has no `auth.users`, no `auth.uid()` and none of
        # Supabase's roles, all of which the schema's foreign keys and RLS
        # policies need before they will apply. See the file's own header.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci-test-db-bootstrap.sql

      - name: Push database schema
        run: npx drizzle-kit push

      - name: Apply the hand written privilege migration
        # `drizzle-kit push` diffs `lib/db/schema.ts`, and the Drizzle schema DSL
        # has no way to say GRANT or REVOKE, so the one hand written migration in
        # `drizzle/` is invisible to it. Applied here by name, after the push that
        # creates the table it grants on. A later privilege migration needs its
        # own line here; there is deliberately no glob, because silently applying
        # whatever happens to be in the directory is how a migration nobody meant
        # to run in CI ends up running in CI.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0003_profiles_column_privileges.sql

      - name: Apply the v1-C notification preference migration
        # v1-C (#143). Grants `notification_preference` on `profiles` to
        # `authenticated` so the person can pick their channel. The column
        # itself is created by drizzle-kit push above; this file only carries
        # the CHECK constraint and the column grant, neither of which the
        # Drizzle schema DSL can express.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0014_profiles_notification_preference.sql

      - name: Apply the profiles.github_url privilege migration
        # JOB-044. Same reasoning as the step above, and the same rule: this one
        # grants `github_url`, which `0010_profiles_github_url.sql`'s ALTER TABLE
        # (picked up by the `drizzle-kit push` step) already added by the time
        # this runs.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0016_profiles_github_url_privileges.sql

      - name: Apply the JOB-101 intake field privilege migration
        # JOB-101. Same reasoning again, and the same rule: this one grants the
        # eight columns `0014_profiles_intake_fields.sql` added, which the
        # `drizzle-kit push` step has already created by the time this runs.
        # There is still deliberately no glob over `drizzle/`; a new privilege
        # migration gets its own line here, on purpose.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0020_profiles_intake_fields_privileges.sql

      - name: Apply the resumes privilege migration
        # JOB-112. Same reasoning again, and its own line rather than a glob for
        # the reason three steps up. This one takes the table wide INSERT and
        # UPDATE grants on `resumes` away from `authenticated` so that `parsed`,
        # which now holds the candidate's employment and education history, has
        # exactly one writer.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0021_resumes_column_privileges.sql

      - name: Apply the JOB-134 answer memory privilege migration
        # JOB-134. Same reasoning again, and its own line rather than a glob for
        # the reason four steps up. This one grants the four intake columns
        # `0017_profiles_answer_memory.sql` added and deliberately leaves
        # `stored_answers` ungranted; see that file for why the fifth column is
        # not on the list.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0023_profiles_answer_memory_privileges.sql

      - name: Apply the JOB-189 Gmail refresh token privilege migration
        # JOB-189. Same reasoning again, and its own line rather than a glob for
        # the reason five steps up. This one grants `gmail_refresh_token`,
        # which `0025_profiles_gmail_refresh_token.sql`'s ALTER TABLE (picked
        # up by the `drizzle-kit push` step) already added by the time this
        # runs, to `service_role` only — deliberately not to `authenticated`;
        # see the migration file for why.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0026_profiles_gmail_refresh_token_privileges.sql

      - name: Apply the JOB-192 profiles SELECT lockdown migration
        # JOB-192. Same reasoning again, and its own line rather than a glob
        # for the reason six steps up. This one revokes the table wide SELECT
        # grant on `profiles` from `authenticated` and `anon` and grants
        # SELECT back on every column except `stripe_customer_id`,
        # `browserbase_context_id` and `gmail_refresh_token`, so the three
        # sensitive columns are readable only by the service role. All 34
        # columns it names have been created either by an earlier migration
        # or by the `drizzle-kit push` step above by the time this runs.
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f drizzle/0027_profiles_column_select_lockdown.sql

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_TEST_USER_EMAIL: e2e-test@example.com

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
